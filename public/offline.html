<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#123d70" />
    <title>Offline | Requisito</title>
    <style>
      :root { color-scheme: light; font-family: system-ui, sans-serif; color: #102b4e; background: #f4f7fb; }
      body { display: grid; min-height: 100vh; margin: 0; place-items: center; padding: 1.5rem; }
      main { width: min(100%, 38rem); border: 1px solid #dce4ef; border-radius: 1rem; background: #fff; padding: 2rem; }
      a { color: #123d70; }
    </style>
  </head>
  <body>
    <main>
      <h1>You’re offline</h1>
      <p>Requisito could not reach the network. Reconnect and try again to load current Davao information.</p>
      <p>Saved checklist progress may be available in this browser when the app itself has loaded.</p>
      <p><a href="/">Try again</a></p>
    </main>
  </body>
</html>
